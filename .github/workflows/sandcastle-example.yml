name: Sandcastle example

on:
  push:
    branches: [main]
    paths:
      - "examples/sandcastle/**"
      - ".github/workflows/sandcastle-example.yml"
  pull_request:
    paths:
      - "examples/sandcastle/**"
      - ".github/workflows/sandcastle-example.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and contract test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/sandcastle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/sandcastle/package-lock.json
      - run: npm ci --omit=optional
      - run: npm run typecheck
      - run: npm test
