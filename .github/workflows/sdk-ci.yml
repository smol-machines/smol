name: SDK CI

# Per-PR gate for the smol SDKs. Runs only the checks that work on a stock
# runner with NO hypervisor and NO libkrun:
#   * Node:   TypeScript type-check (the native .node addon is loaded lazily /
#             via a dynamic require, so `tsc --noEmit` needs no built binary).
#   * Python: the pure-stdlib unit + cloud-mock test scripts (the native
#             extension is imported lazily, only when a local Machine is created).
#
# The native build and the local/live-cloud end-to-end tests need a microVM
# (libkrun + hypervisor) AND the monorepo layout (the crates depend on the
# engine via `path = "../../.."`), so they live in the manually-triggered
# `native-e2e` job below — not the per-PR gate.

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-ci.yml"
  pull_request:
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-check:
    name: Node · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - run: npm ci
      - name: Type-check (no native addon required)
        run: npx tsc -p tsconfig.json --noEmit

  bun-local-e2e:
    name: Bun · local microVM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: monorepo/smol/sdk/node
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target/smol-bun
    steps:
      - name: Checkout smolvm engine
        uses: actions/checkout@v4
        with:
          repository: smol-machines/smolvm
          path: monorepo
          lfs: true
      - name: Checkout smol SDK
        uses: actions/checkout@v4
        with:
          path: monorepo/smol
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install build dependencies
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev musl-tools patchelf pkg-config
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Install SDK dependencies and run Bun tests
        run: |
          bun install --frozen-lockfile
          bun test/unit.ts
          bun test/cloud-mock.ts
      - name: Build guest agent and rootfs
        working-directory: ${{ github.workspace }}/monorepo
        run: |
          cargo build --profile release-small -p smolvm-agent --target x86_64-unknown-linux-musl
          AGENT_BINARY="$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release-small/smolvm-agent" \
            ./scripts/build-agent-rootfs.sh --arch x86_64 --no-build-agent
          sudo tar -cf "${{ runner.temp }}/agent-rootfs.tar" -C target/agent-rootfs .
      - name: Build native addon and boot helper
        env:
          LIBKRUN_BUNDLE: ${{ github.workspace }}/monorepo/lib/linux-x86_64
          SMOLVM_LIB_DIR: ${{ github.workspace }}/monorepo/lib/linux-x86_64
        run: |
          bun run build:native
          cargo build --release --bin smolvm --manifest-path ../../../Cargo.toml
      - name: Assemble release assets
        env:
          SMOLVM_LIB_DIR: ${{ github.workspace }}/monorepo/lib/linux-x86_64
          SMOLVM_HELPER: ${{ github.workspace }}/.cargo-target/smol-bun/release/smolvm
          SMOLVM_ROOTFS_TAR: ${{ runner.temp }}/agent-rootfs.tar
        run: |
          bash scripts/bundle-native.sh
          bun run build:ts
          cp binding.js binding.d.ts smol.*.node dist/
      - name: Run zero-config Bun lifecycle
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/bun-smol-data
          XDG_CACHE_HOME: ${{ runner.temp }}/bun-smol-cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/bun-smol-config
        run: |
          unset SMOLVM_BOOT_BINARY SMOLVM_LIB_DIR SMOLVM_AGENT_ROOTFS SMOLVM_AGENT_ROOTFS_TAR LD_LIBRARY_PATH
          bun test/e2e.ts
          bun test/bun-package-e2e.ts

  python-check:
    name: Python · unit + cloud-mock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile the package (catches syntax errors anywhere)
        run: python -m compileall -q python/smol
      - name: Unit tests (error parsing + path encoding; pure Python)
        run: python tests/test_unit.py
      - name: Cloud-transport tests (mock /v1 server; pure Python)
        run: python tests/test_cloud_mock.py
      - name: Cloud start-failure surfacing (mock /v1 server; pure Python)
        run: python tests/test_cloud_start_error.py
      - name: Cloud no-port readiness probe (mock /v1 server; pure Python)
        run: python tests/test_cloud_ready_no_ports.py
      - name: Async-transport tests (AsyncMachine vs mock /v1; pure Python)
        run: python tests/test_async_mock.py
      - name: verifiers runtime adapter (pure mapping; skips runtime checks without verifiers)
        run: python tests/test_verifiers_adapter.py

  # --------------------------------------------------------------------------
  # The Bun job above covers the native Linux lifecycle on every SDK PR. Keep a
  # manual placeholder for future Python-native and macOS coverage.
  # --------------------------------------------------------------------------
  native-e2e:
    name: Native build + e2e (manual; needs libkrun)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest # replace with: [self-hosted, libkrun]
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder
        run: |
          echo "Configure a libkrun-equipped self-hosted runner, then run e.g.:"
          echo "  # Python: maturin develop --release && python tests/test_local_e2e.py"
          echo "  # Node:   npm run test:e2e"
          echo "These need /dev/kvm (Linux) or HVF (macOS) + the bundled libkrun."
