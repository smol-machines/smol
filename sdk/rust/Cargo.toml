# Embedded Rust SDK for smol machines — boots microVMs in-process, no daemon.
# This is its own workspace; it path-depends on the sibling `smolvm` engine
# (checked out beside `smol/`), mirroring `sdk/node` and `sdk/python`.
[workspace]

[package]
name = "smolmachines"
version = "1.9.0"
edition = "2021"
rust-version = "1.82"
description = "Embed smol machines microVMs directly in a Rust process"
license = "Apache-2.0"
repository = "https://github.com/smol-machines/smol"
readme = "README.md"
keywords = ["microvm", "sandbox", "virtualization", "vm"]
categories = ["virtualization", "api-bindings"]

[dependencies]
# No engine dependency on purpose: crates.io resolves every dependency, so
# linking the unpublished engine crate would make this SDK unpublishable. Local
# machines are driven through an installed `smolvm` binary instead.
# The cloud transport. Shared with the `smol` CLI so the two clients of the
# control plane cannot drift. Blocking, because the whole SDK is: the caller
# owns the choice of runtime.
smol-cloud = { path = "../../crates/smol-cloud", version = "1.9.0", features = ["blocking"] }
serde_json = "1"

[dev-dependencies]
# The mock control plane in tests/ asserts on the exact JSON the SDK sends.
serde_json = "1"
