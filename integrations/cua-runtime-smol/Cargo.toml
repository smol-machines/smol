# An external runtime provider for Cua (https://cua.ai): `cua sb create
# --runtime smol` runs a Space as a smol machine. Its own workspace, like the
# Rust SDK it is built on, so the CLI workspace (which path-depends on the
# engine checkout) does not have to be buildable to build this.
[workspace]

[package]
name = "cua-runtime-smol"
version = "1.32.4"
edition = "2021"
rust-version = "1.82"
description = "Run Cua Spaces as smol machines: an external runtime provider for the cua CLI and SDK"
license = "Apache-2.0"
repository = "https://github.com/smol-machines/smol"
readme = "README.md"
publish = false

[[bin]]
name = "cua-runtime-smol"
path = "src/main.rs"

[dependencies]
smolmachines = { path = "../../sdk/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "5"
